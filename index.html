<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>OpenDuel — A Modern Tribute to Autoduel</title>
    <meta name="description" content="One car, one driver, sixteen cities, and a highway that wants you dead. Build a car, run courier work, survive the road, and win in the arena." />
    <link rel="canonical" href="https://arcade.shoemoney.com/smduel/" />
    <meta name="theme-color" content="#05070a" />
    <!-- og:image and the favicon are absolute arcade URLs, not relative: the page is served from the /smduel/ subpath under vite's `base: './'`, and vite never rewrites or emits assets referenced from meta[content]. -->
    <meta property="og:title" content="OpenDuel — A Modern Tribute to Autoduel" />
    <meta property="og:description" content="One car, one driver, sixteen cities, and a highway that wants you dead. Build a car, run courier work, survive the road, and win in the arena." />
    <meta property="og:url" content="https://arcade.shoemoney.com/smduel/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ShoeMoney Arcade" />
    <meta property="og:image" content="https://arcade.shoemoney.com/brand/smduel-gameplay.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="720" />
    <meta property="og:image:alt" content="OpenDuel gameplay: a Division 5 arena match" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OpenDuel — A Modern Tribute to Autoduel" />
    <meta name="twitter:description" content="One car, one driver, sixteen cities, and a highway that wants you dead. Build a car, run courier work, survive the road, and win in the arena." />
    <meta name="twitter:image" content="https://arcade.shoemoney.com/brand/smduel-gameplay.png" />
    <link rel="icon" href="https://arcade.shoemoney.com/brand/shoemoney-logo.webp" />
    <!-- The design system: reset, palette, type ramp, spacing, and the
         document shell that used to live in an inline <style> block here.
         Linked (not imported from app.ts) so the page has its dark background
         and base type BEFORE the module graph runs — no white flash during
         boot. hud.css also @imports it, so the HUD is never styled without it. -->
    <link rel="stylesheet" href="./src/ui/tokens.css" />
    <!-- The loading splash's own styles are INLINE and deliberately not in
         tokens.css. The splash has to be on screen before the module graph has
         even started executing — a linked stylesheet is a render-blocking
         request, so waiting for one here would defeat the entire point of
         having a splash. Inline costs ~1KB and paints on the first frame. -->
    <style>
      /* The splash is deliberately self-contained — it has to paint before the
         module graph, and therefore before any bundled CSS — so the one design
         token it needs is defined HERE, on :root, rather than in
         src/ui/tokens.css. tokens.css consumes this same custom property and
         deliberately does not redefine it, so the display face has exactly one
         owner even though the first paint cannot read the stylesheet that owns
         the rest of the system.

         Autoduel's 1985 face was a wide, heavy, mechanical grotesque. This
         stack gets there with what is actually installed — a condensed heavy
         grotesque, tightened and tracked out — rather than shipping a font
         file for four words and a few headings. Uppercase plus tracking is doing
         as much of the work as the family is. */
      :root {
        --ui-font-display: 'Arial Narrow', 'Helvetica Neue Condensed', 'Roboto Condensed',
          'Liberation Sans Narrow', 'Avenir Next Condensed', system-ui, sans-serif;
      }

      /* Shown from the first paint until src/ui/loading-screen.ts takes over and
         removes the element. aria-busy marks it as transient; the progress bar
         is a real <progress>-shaped role so a screen reader is told it is
         indeterminate-then-determinate rather than being shown a mystery div. */
      .sm-boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        /* Pure black, not the old radial gradient. The tribute card is the first
           thing anyone sees and it is a credit to a 1985 game, so it reads as a
           title card on a dark screen rather than as part of the loading chrome. */
        background: #000;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        transition: opacity 320ms ease;
      }
      .sm-boot[hidden] { display: none; }
      .sm-boot--out { opacity: 0; pointer-events: none; }

      /* --- The Autoduel tribute card ---------------------------------------
         Two stages share this one splash element. The tribute is on screen
         first, alone on black; when it hands over, it scrolls up and out while
         the logo/bar/status fade in behind it. One element means one opaque
         background, so the handover cannot reveal a seam or double-black.

         The stage is a class on the root rather than a separate screen because
         the splash has to exist on the FIRST PAINT (see the note on the markup
         below) — anything created by JS arrives after the browser has already
         spent real time parsing the module graph, which is the exact stretch a
         splash exists to cover. */
      .sm-boot__tribute {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(14px, 2.6vh, 26px);
        padding: 0 clamp(20px, 7vw, 72px);
        text-align: center;
        /* `backwards`, NOT `both` — and the reason is a bug this exact card had
           on its first run. A filled animation pins its `to` state forever and
           outranks ordinary declarations, so `both` held the card at
           `opacity: 1` and the handover class below could never fade it out: the
           card and the loading chrome rendered on top of each other, the
           progress bar lying straight across the credit. `backwards` fills only
           BEFORE the animation starts, which is all the staggered delay needs,
           and hands the element back to its declared styles the moment the
           entrance ends. */
        animation: sm-tribute-in 900ms cubic-bezier(0.16, 1, 0.3, 1) backwards;
        transition: transform 520ms cubic-bezier(0.7, 0, 0.84, 0), opacity 420ms ease;
      }
      @keyframes sm-tribute-in {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .sm-boot--loading .sm-boot__tribute {
        transform: translateY(-72px);
        opacity: 0;
      }
      /* The four lines stagger in. Each is delayed rather than animated
         separately so the whole card still costs one element's worth of
         layout. */
      .sm-boot__tribute > * { animation: sm-tribute-line 620ms cubic-bezier(0.16, 1, 0.3, 1) backwards; }
      .sm-boot__tribute > *:nth-child(1) { animation-delay: 120ms; }
      .sm-boot__tribute > *:nth-child(2) { animation-delay: 340ms; }
      .sm-boot__tribute > *:nth-child(3) { animation-delay: 560ms; }
      .sm-boot__tribute > *:nth-child(4) { animation-delay: 780ms; }
      @keyframes sm-tribute-line {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      .sm-boot__tribute-kicker {
        font-size: clamp(9px, 1.5vw, 11px);
        letter-spacing: 0.42em;
        text-transform: uppercase;
        color: rgba(233, 239, 246, 0.42);
      }
      .sm-boot__tribute-title {
        font-family: var(--ui-font-display);
        font-size: clamp(24px, 6.2vw, 52px);
        line-height: 1.02;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #ffd23f;
        text-shadow: 0 0 26px rgba(255, 210, 63, 0.32);
      }
      .sm-boot__tribute-line {
        max-width: 46ch;
        font-size: clamp(12px, 2.5vw, 17px);
        line-height: 1.55;
        color: #f2f6fa;
        text-wrap: balance;
      }
      /* ONE rule for the whole card: bold text is yellow, regular text is
         white. Stated once so the four lines cannot disagree about it. */
      .sm-boot__tribute-line strong {
        color: #ffd23f;
        font-weight: 700;
      }
      .sm-boot__tribute-rule {
        width: min(340px, 62vw);
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255, 210, 63, 0.55), transparent);
      }
      @media (prefers-reduced-motion: reduce) {
        .sm-boot__tribute,
        .sm-boot__tribute > * { animation: none; }
        .sm-boot--loading .sm-boot__tribute { transform: none; opacity: 0; }
        .sm-boot__tribute { transition: none; }
      }

      /* The loading chrome is present from the first paint but INVISIBLE while
         the tribute holds the screen, so the handover is a cross-fade rather
         than a layout jump. `visibility` (not just opacity) keeps it out of the
         accessibility tree and out of hit-testing until it is real.

         The chrome's fade is DELAYED so it arrives as the card is already
         leaving. Undelayed, both were fully opaque at the same time on the
         first run and the card's text rendered straight through the logo and
         the progress bar. */
      .sm-boot__logo,
      .sm-boot__bar,
      .sm-boot__status,
      .sm-boot__brand {
        opacity: 0;
        visibility: hidden;
        transition: opacity 420ms ease, visibility 0s linear 420ms;
      }
      .sm-boot--loading .sm-boot__logo,
      .sm-boot--loading .sm-boot__bar,
      .sm-boot--loading .sm-boot__status,
      .sm-boot--loading .sm-boot__brand {
        opacity: 1;
        visibility: visible;
        transition: opacity 420ms ease 280ms, visibility 0s;
      }

      .sm-boot__logo {
        width: min(168px, 34vw);
        height: auto;
        filter: drop-shadow(0 6px 26px rgba(79, 214, 196, 0.28));
        animation: sm-boot-pulse 2.6s ease-in-out infinite;
      }
      @keyframes sm-boot-pulse {
        0%, 100% { opacity: 0.82; transform: translateY(0); }
        50%      { opacity: 1;    transform: translateY(-4px); }
      }
      /* Respect the OS setting: a pulsing logo on a reduced-motion machine is
         a vestibular trigger, and this is decorative motion. */
      @media (prefers-reduced-motion: reduce) {
        .sm-boot__logo { animation: none; opacity: 1; }
        .sm-boot { transition: none; }
      }

      .sm-boot__bar {
        position: relative;
        width: min(420px, 74vw);
        height: 4px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.09);
        overflow: hidden;
      }
      /* The FILL is the real progress value. It is a scaleX transform rather
         than a width so it animates on the compositor and never triggers
         layout on every update. */
      .sm-boot__fill {
        position: absolute;
        inset: 0;
        transform-origin: left center;
        transform: scaleX(0);
        border-radius: inherit;
        background: linear-gradient(90deg, #4fd6c4 0%, #63a8ff 55%, #ffffff 100%);
        transition: transform 240ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      /* A slow sheen while the bar is not yet at 100%, so a long load still
         reads as "alive" rather than frozen. Removed once progress completes. */
      .sm-boot__bar::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.35) 50%, transparent 100%);
        transform: translateX(-100%);
        animation: sm-boot-sheen 1.5s ease-in-out infinite;
      }
      .sm-boot__bar--done::after { animation: none; opacity: 0; }
      @keyframes sm-boot-sheen {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .sm-boot__bar::after { animation: none; }
        .sm-boot__fill { transition: none; }
      }

      .sm-boot__status {
        min-height: 1.2em;
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(215, 224, 234, 0.72);
      }
      .sm-boot__brand {
        position: absolute;
        bottom: max(22px, env(safe-area-inset-bottom));
        font-size: 11px;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: rgba(215, 224, 234, 0.4);
        text-align: center;
        padding: 0 16px;
      }
      .sm-boot__brand strong { color: rgba(215, 224, 234, 0.66); font-weight: 600; }
    </style>
  </head>
  <body>
    <a class="arcade-home-link" href="https://arcade.shoemoney.com/" aria-label="ShoeMoney Arcade">
      <img src="https://arcade.shoemoney.com/brand/shoemoney-logo.webp" alt="" width="20" height="20" />
      <span class="arcade-home-label">Arcade</span>
    </a>
    <div id="app"></div>
    <!-- The loading splash. Present in the HTML rather than created by JS so it
         exists on the first paint: by the time any module runs, the browser has
         already spent real time parsing and fetching the graph, and showing a
         blank page for that stretch is exactly what a splash is for.
         Removed by src/ui/loading-screen.ts once the first screen is ready. -->
    <div class="sm-boot" id="sm-boot" role="status" aria-live="polite" aria-busy="true">
      <!-- The tribute card. Sits first in the DOM and covers the loading chrome
           (which is present but transparent until `.sm-boot--loading`), so the
           credit is what the player actually reads while the game loads.
           Bold words are yellow and regular words are white — one rule, applied
           by the `.sm-boot__tribute-line strong` selector below, so the four
           lines cannot drift apart. `aria-hidden` on the rule and kicker keeps
           a screen reader on the meaningful lines rather than the chrome. -->
      <div class="sm-boot__tribute">
        <p class="sm-boot__tribute-kicker" aria-hidden="true">Apple II &middot; 1985</p>
        <h1 class="sm-boot__tribute-title">Inspired by a Childhood Classic</h1>
        <p class="sm-boot__tribute-line">
          This game is a modern reimagining of <strong>Autoduel (1985)</strong>.
        </p>
        <p class="sm-boot__tribute-line">
          Original game by <strong>Origin Systems</strong>, designed by
          <strong>Chuckles and Lord British</strong>.
        </p>
        <div class="sm-boot__tribute-rule" aria-hidden="true"></div>
        <p class="sm-boot__tribute-line">
          Thank you for the memories.
        </p>
      </div>

      <img class="sm-boot__logo" src="./assets/shoemoney-logo.png" alt="" width="512" height="414" />
      <div
        class="sm-boot__bar"
        id="sm-boot-bar"
        role="progressbar"
        aria-label="Loading"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
      >
        <div class="sm-boot__fill" id="sm-boot-fill"></div>
      </div>
      <p class="sm-boot__status" id="sm-boot-status">Warming up</p>
      <p class="sm-boot__brand">A <strong>ShoeMoney</strong> AI Labs Game</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
