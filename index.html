<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>smduel</title>
    <meta name="description" content="One car, one driver, sixteen cities, and a highway that wants you dead. Build a car, run courier work, survive the road, and win in the arena." />
    <link rel="canonical" href="https://arcade.shoemoney.com/smduel/" />
    <meta name="theme-color" content="#05070a" />
    <!-- og:image and the favicon are absolute arcade URLs, not relative: the page is served from the /smduel/ subpath under vite's `base: './'`, and vite never rewrites or emits assets referenced from meta[content]. -->
    <meta property="og:title" content="smduel" />
    <meta property="og:description" content="One car, one driver, sixteen cities, and a highway that wants you dead. Build a car, run courier work, survive the road, and win in the arena." />
    <meta property="og:url" content="https://arcade.shoemoney.com/smduel/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ShoeMoney Arcade" />
    <meta property="og:image" content="https://arcade.shoemoney.com/brand/smduel-gameplay.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="720" />
    <meta property="og:image:alt" content="smduel gameplay: a Division 5 arena match" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="smduel" />
    <meta name="twitter:description" content="One car, one driver, sixteen cities, and a highway that wants you dead. Build a car, run courier work, survive the road, and win in the arena." />
    <meta name="twitter:image" content="https://arcade.shoemoney.com/brand/smduel-gameplay.png" />
    <link rel="icon" href="https://arcade.shoemoney.com/brand/shoemoney-logo.webp" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05070a;
        color: #d7e0ea;
        font-family: system-ui, sans-serif;
        overscroll-behavior: none;
      }
      #app {
        position: relative;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
      }
      /* Static chrome lives outside #app: every screen mount in src/app.ts does
         root.innerHTML = '' on #app (its clearAndAppend helper), which would
         destroy anything mounted inside it on every screen change. Sitting
         outside #app survives every transition with no JS and cannot steal
         focus on mount. */
      .arcade-home-link {
        position: fixed;
        top: 8px;
        left: 8px;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        min-height: 44px;
        box-sizing: border-box;
        background: rgba(10, 14, 20, 0.55);
        border: 1px solid rgba(79, 214, 196, 0.35);
        border-radius: 4px;
        color: #d7e0ea;
        font-family: system-ui, sans-serif;
        font-size: 12px;
        text-decoration: none;
        line-height: 1;
      }
      .arcade-home-link img {
        display: block;
        border-radius: 2px;
      }
      @media (pointer: coarse) {
        .arcade-home-link {
          padding: 6px;
          min-width: 44px;
          justify-content: center;
        }
        .arcade-home-link .arcade-home-label {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <a class="arcade-home-link" href="https://arcade.shoemoney.com/" aria-label="ShoeMoney Arcade">
      <img src="https://arcade.shoemoney.com/brand/shoemoney-logo.webp" alt="" width="20" height="20" />
      <span class="arcade-home-label">Arcade</span>
    </a>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
