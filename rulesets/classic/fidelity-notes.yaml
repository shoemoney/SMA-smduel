# rulesets/classic/fidelity-notes.yaml
#
# Provenance ledger for every gameplay constant across rulesets/classic/*.json.
# One entry per constant (a number or boolean that feeds simulation math — not
# an id/name/label/enum string, which carries no fidelity claim of its own).
# Release gate: no Reconstruction constant may exist without an entry here.
#
# status:
#   Exact         - stated by the original manual's tables (construction/price/
#                   weight/space/DP/ammo/facing/service-price/time-cost numbers).
#   Observed      - documented repeatedly through play, never published as a
#                   formula (division rewards, prestige gates, championship dates).
#   Reconstruction - this recreation's own tunable implementation, chosen to
#                   reproduce documented behavior (weapon range/cooldown/accuracy/
#                   damage/projectileSpeed, all driving coefficients, all economy
#                   decay curves, and everything under a `_reconstruction` key).
#
# Generated programmatically from rulesets/classic/*.json by the integrator pass — 704 entries,
# plus 6 entries added by audit (arenas.houseVehicle.totalCount/salvageable and the four
# quests.quests.the-boss-tape.onAccept/onDeliver flags the integrator's pass missed) — 710 entries.

